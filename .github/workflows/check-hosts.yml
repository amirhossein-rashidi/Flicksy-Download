name: check-hosts

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: check hosts
        run: |
          urls="
          https://sjdcbjdhbcsjhhsdjcbjsd.mehracdn.com/Film/
          https://sjdcbjdhbcsjhhsdjcbjsd.mehracdn.com/Series/
          https://sjdcbjdhbscjnhsdjcbjsd.mehracdn.com/pnot/
          https://sjdcbjhdbscjhbsdjbcjsd.mehracdn.com/Film/
          https://sjdcbjhdbscjhbsdjcbjsd.mehracdn.com/yA3f/
          https://tokyo.saymyname.website/Movies
          https://nairobi.saymyname.website/Movies
          https://berlin.saymyname.website/
          https://helsinki.saymyname.website/
          https://saymyname.website/
          https://subtitle.saymyname.website/
          https://dl5.sermoviedown.pw/
          https://dl6.sermoviedown.pw/
          https://sermoviedown.pw/
          "
          for u in $urls; do
            echo "=== $u"
            curl -sS -m 25 -D /tmp/h.txt -o /tmp/b.txt -w "code=%{http_code}\n" "$u" 2>&1 | tail -3
            grep -iE '^(server|via|cf-ray|retry-after|content-type):' /tmp/h.txt 2>/dev/null | head -6
            head -c 200 /tmp/b.txt 2>/dev/null | tr '\n\r' '  '
            echo
            rm -f /tmp/h.txt /tmp/b.txt
            sleep 1
          done

name: build-site

on:
  push:
    branches: [main]
    paths:
      - 'data-in/**'
      - 'config/publish-hosts.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build
        run: python tools/build_site.py

      - name: commit
        run: |
          git config user.name "flicksy-bot"
          git config user.email "flicksy-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Auto build: update public data"
            git pull --rebase origin main
            git push
          fi

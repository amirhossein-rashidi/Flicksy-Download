name: scan-open

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: scan open hosts
        id: scan
        continue-on-error: true
        run: python tools/scan_sources.py --mode open --sources config/sources.txt --out-dir data-in/scans --max-minutes 150

      - name: build site
        run: python tools/build_site.py

      - name: commit
        run: |
          git config user.name "flicksy-bot"
          git config user.email "flicksy-bot@users.noreply.github.com"
          git add data-in/scans public/data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Auto scan and build"
            git pull --rebase origin main
            git push
          fi

      - name: report scan problem
        if: steps.scan.outcome == 'failure'
        run: |
          echo "At least one scan did not finish; its old result was kept."
          exit 1

name: tmdb-sync

on:
  schedule:
    - cron: '20 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-site

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch TMDB lists and match with our titles
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python tools/tmdb_sync.py
      - name: Commit result
        run: |
          git config user.name "flicksy-bot"
          git config user.email "flicksy-bot@users.noreply.github.com"
          git add public/data/tmdb-rows.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "TMDB rows update"
            git pull --rebase
            git push
          fi
